<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>내 홈페이지</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #1e293b;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
    width: 320px;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

button {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    background: #3b82f6;
    color: white;
    transition: 0.2s;
}

button:hover {
    background: #2563eb;
    transform: scale(1.02);
}

.sub-buttons {
    display: none;
    margin-top: 10px;
}

.sub-buttons button {
    background: #e5edff;
    color: #1e293b;
}

.sub-buttons button:hover {
    background: #c7d2fe;
}
</style>
</head>

<body>

<div class="container">

    <button onclick="toggleCommunity()">커뮤니티</button>

    <div class="sub-buttons" id="communityMenu">
        <button onclick="goLink('https://discord.com/channels/1409051451535130696/1447358439008243865')">디스코드</button>
        <button onclick="goLink('https://open.kakao.com/o/gnYNEtZh')">공지방</button>
        <button onclick="goLink('https://open.kakao.com/o/gUIwDdMh')">소통방</button>
    </div>

    <button>버튼 2 (미정)</button>
    <button>버튼 3 (미정)</button>
    <button>버튼 4 (미정)</button>

</div>

<script>
function toggleCommunity() {
    const menu = document.getElementById("communityMenu");

    menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

function goLink(url) {
    window.open(url, "_blank");
}
</script>

</body>
</html>
