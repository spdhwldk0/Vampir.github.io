<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 홈페이지</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #1e293b;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
    width: 320px;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

button {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    background: #3b82f6;
    color: white;
    transition: 0.2s;
}

button:hover {
    background: #2563eb;
    transform: scale(1.02);
}

.sub-buttons {
    display: none;
    margin-bottom: 10px;
}

.sub-buttons button {
    background: #e5edff;
    color: #1e293b;
}

.sub-buttons button:hover {
    background: #c7d2fe;
}
    @media (max-width: 768px) {
    body {
        padding: 20px;
        height: auto;
    }

    .container {
        width: 100%;
        max-width: 400px;
        padding: 25px;
    }

    button {
        font-size: 18px;
        padding: 18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- 커뮤니티 -->
    <button onclick="toggle('community')">커뮤니티</button>
    <div class="sub-buttons" id="community">
        <button onclick="goLink('https://discord.com/channels/1409051451535130696/1447358439008243865')">디스코드</button>
        <button onclick="goLink('https://open.kakao.com/o/gnYNEtZh')">공지방</button>
        <button onclick="goLink('https://open.kakao.com/o/gUIwDdMh')">소통방</button>
    </div>

    <!-- 시트 -->
    <button onclick="toggle('sheet')">시트</button>
    <div class="sub-buttons" id="sheet">
        <button onclick="goLink('https://docs.google.com/spreadsheets/d/1hYLdChhjJa22knwb22sqWf3UeLFN4SgGTJUZ6HhBJKQ/edit?gid=1864381143#gid=1864381143')">종합 시트</button>
        <button onclick="goLink('https://docs.google.com/forms/d/e/1FAIpQLSduZjQQckag4KOYvkpc14Euyt-qc46TGIGcp6nau7nyAOc9YQ/viewform')">전투력 갱신</button>
    </div>

    <!-- 유튜브 -->
    <button onclick="toggle('youtube')">유튜브</button>
    <div class="sub-buttons" id="youtube">
        <button onclick="goLink('https://www.youtube.com/@%EC%9C%A0%ED%8A%9C%EB%B8%8C%EB%B9%85%EB%B3%B4%EC%8A%A4')">빅보스</button>
        <button onclick="goLink('https://www.youtube.com/@%EC%9E%AC%EB%B2%94%EA%B5%B0%EC%A3%BC')">재범군주</button>
        <button onclick="goLink('https://www.youtube.com/@%EC%95%84%EC%9D%B4%EC%97%A0%EC%86%94%EC%9D%B4')">아이엠솔이</button>
        <button onclick="goLink('https://www.youtube.com/@%EC%9B%90%ED%81%90')">원큐</button>
        <button onclick="goLink('https://www.youtube.com/@%EC%82%AC%EB%95%85%EC%9D%B4')">사땅</button>
    </div>

    <!-- 운영진 -->
    <button onclick="toggle('etc')">운영진</button>
    <div class="sub-buttons" id="etc">
        <button onclick="goLink('https://open.kakao.com/o/sCF92ZXh')">시트관리 : 갓더헬</button>
        <button onclick="goLink('https://open.kakao.com/o/sbOCEYci')">은행 출금 : 유연</button>
        <button onclick="goLink('https://open.kakao.com/me/ssjun')">아이템 창고 : 써준</button>
    </div>

</div>

<script>
function toggle(id) {
    const menus = document.querySelectorAll(".sub-buttons");

    menus.forEach(menu => {
        if (menu.id !== id) menu.style.display = "none";
    });

    const current = document.getElementById(id);
    current.style.display = current.style.display === "block" ? "none" : "block";
}

function goLink(url) {
    window.open(url, "_blank");
}
</script>

</body>
</html>
