<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 홈페이지</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #c7d2fe, #e0e7ff);
    color: #1e293b;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
    width: 320px;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

button {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    background: #3b82f6;
    color: white;
    transition: 0.2s;
    position: relative;
    text-align: center;
}

button:hover {
    background: #2563eb;
    transform: scale(1.02);
}

.sub-buttons {
    display: none;
    margin-bottom: 10px;
}

.sub-buttons button {
    background: #dbe4ff;
    color: #1e293b;
}

.sub-buttons button:hover {
    background: #c7d2fe;
}

/* 아이콘 색상 */
.fa-youtube { color: #ff0000; }
.fa-discord { color: #5865F2; }
.fa-file-excel { color: #16a34a; }

i {
    font-size: 20px;
}

/* 아이콘 왼쪽 고정 */
button i,
button img {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
}

/* 카카오 이미지 */
.kakao-icon {
    width: 22px;
    height: 22px;
}

/* ===== 툴팁 스타일 ===== */

.tooltip {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    display: inline-block;
}

.info-icon {
    font-size: 14px;
    color: #f59e0b;
}

.tooltip-text {
    visibility: hidden;
    opacity: 0;
    width: 200px;
    background-color: #1e293b;
    color: #fff;
    text-align: center;
    padding: 8px 10px;
    border-radius: 8px;
    position: absolute;
    bottom: 130%;
    right: 0;
    transition: opacity 0.2s ease-in-out;
    font-size: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    z-index: 10;
}

/* 말풍선 꼬리 */
.tooltip-text::after {
    content: "";
    position: absolute;
    top: 100%;
    right: 15px;
    border-width: 6px;
    border-style: solid;
    border-color: #1e293b transparent transparent transparent;
}

/* hover 시 표시 */
.tooltip:hover .tooltip-text {
    visibility: visible;
    opacity: 1;
}

/* 모바일 */
@media (max-width: 768px) {
    body {
        padding: 20px;
        height: auto;
    }

    .container {
        width: 100%;
        max-width: 400px;
        padding: 25px;
    }

    button {
        font-size: 18px;
        padding: 18px;
    }
}
</style>
</head>

<body>

<div class="container">

<button onclick="toggle('community')">커뮤니티</button>
<div class="sub-buttons" id="community">
    <button onclick="goLink('https://discord.com/invite/3NNaMXAmqf')">
        <i class="fa-brands fa-discord"></i> 디스코드
    </button>
    <button onclick="goLink('https://open.kakao.com/o/gnYNEtZh')">
        <img src="kakao.png" class="kakao-icon"> 공지방
    </button>
    <button onclick="goLink('https://open.kakao.com/o/gUIwDdMh')">
        <img src="kakao.png" class="kakao-icon"> 소통방
    </button>
</div>

<button onclick="toggle('sheet')">시트</button>
<div class="sub-buttons" id="sheet">
    <button onclick="goLink('https://docs.google.com/spreadsheets/d/1hYLdChhjJa22knwb22sqWf3UeLFN4SgGTJUZ6HhBJKQ/edit?gid=1864381143#gid=1864381143')">
        <i class="fa-solid fa-file-excel"></i> 종합 시트
    </button>

    <!-- 전투력 갱신 (툴팁 적용) -->
    <button onclick="goLink('https://docs.google.com/forms/d/e/1FAIpQLSduZjQQckag4KOYvkpc14Euyt-qc46TGIGcp6nau7nyAOc9YQ/viewform')">
        <i class="fa-solid fa-file-excel"></i> 전투력 갱신
        
        <span class="tooltip">
            <i class="fa-solid fa-circle-info info-icon"></i>
            <span class="tooltip-text">
                초월이 없을 경우 공란으로 해주세요
            </span>
        </span>
    </button>
</div>

<button onclick="toggle('youtube')">유튜브</button>
<div class="sub-buttons" id="youtube">
    <button onclick="goLink('https://www.youtube.com/@%EC%9C%A0%ED%8A%9C%EB%B8%8C%EB%B9%85%EB%B3%B4%EC%8A%A4')">
        <i class="fa-brands fa-youtube"></i> 빅보스
    </button>
</div>

</div>

<script>
function toggle(id) {
    const menus = document.querySelectorAll(".sub-buttons");

    menus.forEach(menu => {
        if (menu.id !== id) menu.style.display = "none";
    });

    const current = document.getElementById(id);
    current.style.display = current.style.display === "block" ? "none" : "block";
}

function goLink(url) {
    window.open(url, "_blank");
}
</script>

</body>
</html>
