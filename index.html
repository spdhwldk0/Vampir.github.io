<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>내 홈페이지</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
    width: 300px;
}

button {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    background: #2563eb;
    color: white;
}

button:hover {
    background: #1d4ed8;
}

.sub-buttons {
    display: none;
    margin-top: 10px;
}

.sub-buttons button {
    background: #334155;
}

.sub-buttons button:hover {
    background: #475569;
}
</style>
</head>

<body>

<div class="container">

    <!-- 커뮤니티 -->
    <button onclick="toggleCommunity()">커뮤니티</button>

    <div class="sub-buttons" id="communityMenu">
        <button onclick="goLink('https://discord.com/channels/1409051451535130696/1447358439008243865')">디스코드</button>
        <button onclick="goLink('https://open.kakao.com/o/gUIwDdMh')">공지방</button>
        <button onclick="goLink('https://open.kakao.com/o/gnYNEtZh')">소통방</button>
    </div>

    <!-- 나머지 3개 버튼 (미정) -->
    <button>버튼 2 (미정)</button>
    <button>버튼 3 (미정)</button>
    <button>버튼 4 (미정)</button>

</div>

<script>
function toggleCommunity() {
    const menu = document.getElementById("communityMenu");

    if (menu.style.display === "none" || menu.style.display === "") {
        menu.style.display = "block";
    } else {
        menu.style.display = "none";
    }
}

function goLink(url) {
    window.open(url, "_blank");
}
</script>

</body>
</html>
